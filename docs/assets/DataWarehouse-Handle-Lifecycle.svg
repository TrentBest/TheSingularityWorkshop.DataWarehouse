<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
<title id="title">DataWarehouse — handle lifetime</title><desc id="desc">An allocated handle identifies shelf, slot and generation. Mutable access marks dirty, clean acknowledges work, free invalidates the old generation, and reallocation reuses the slot with a new generation.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071523"/><stop offset="1" stop-color="#172d45"/></linearGradient><linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#37d9ef"/><stop offset="1" stop-color="#3879d9"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/></filter></defs>
<rect width="1440" height="760" rx="32" fill="url(#bg)"/><text x="82" y="78" fill="#6ce7f3" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="5">THE SINGULARITY WORKSHOP · DATAWAREHOUSE</text>
<text x="82" y="142" fill="#f3f8ff" font-family="Segoe UI,Arial,sans-serif" font-size="48" font-weight="750">A handle has a lifetime</text><text x="82" y="183" fill="#b6c9d9" font-family="Segoe UI,Arial,sans-serif" font-size="22">Identity is more than an index: the generation rejects stale references after reuse.</text>
<g filter="url(#s)"><rect x="82" y="245" width="270" height="130" rx="18" fill="#123d50" stroke="#40cde0" stroke-width="2"/><rect x="420" y="245" width="270" height="130" rx="18" fill="#202d50" stroke="#8d83e9" stroke-width="2"/><rect x="758" y="245" width="270" height="130" rx="18" fill="#16344a" stroke="#3e8fa8" stroke-width="2"/><rect x="1096" y="245" width="262" height="130" rx="18" fill="#123d50" stroke="#40cde0" stroke-width="2"/></g>
<g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle" fill="#f3f8ff"><text x="217" y="292" font-size="25" font-weight="700">1 · Allocate</text><text x="217" y="328" font-size="17" fill="#b6c9d9">Slot becomes alive</text><text x="555" y="292" font-size="25" font-weight="700">2 · Mutate</text><text x="555" y="328" font-size="17" fill="#c8c4ff">Dirty bit is set</text><text x="893" y="292" font-size="25" font-weight="700">3 · Mark clean</text><text x="893" y="328" font-size="17" fill="#b6c9d9">Work acknowledged</text><text x="1227" y="292" font-size="25" font-weight="700">4 · Free</text><text x="1227" y="328" font-size="17" fill="#a9edf3">Old handle invalid</text></g>
<g stroke="#7edfeb" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M352 310 H410 l-9 -8 m9 8 -9 8"/><path d="M690 310 H748 l-9 -8 m9 8 -9 8"/><path d="M1028 310 H1086 l-9 -8 m9 8 -9 8"/></g>
<path d="M1227 375 V432 H217 V389" fill="none" stroke="#8d83e9" stroke-width="3" stroke-dasharray="8 8"/><path d="M217 389 l-8 12 m8 -12 8 12" fill="none" stroke="#8d83e9" stroke-width="3"/>
<rect x="430" y="405" width="584" height="54" rx="27" fill="#28284d" stroke="#8d83e9" stroke-width="1.5"/><text x="722" y="440" fill="#e3dcff" font-family="Segoe UI,Arial,sans-serif" font-size="19" text-anchor="middle">Slot may be reused · generation advances</text>
<g transform="translate(82 505)"><rect width="1276" height="154" rx="18" fill="#0b1e2d" stroke="#31536a" stroke-width="2"/><text x="28" y="38" fill="#8ceaf3" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2">HANDLE IDENTITY</text><g font-family="Consolas,monospace" font-size="25" font-weight="700"><rect x="28" y="58" width="265" height="62" rx="10" fill="#163c52"/><text x="160" y="97" fill="#e9f7ff" text-anchor="middle">ShelfId</text><rect x="310" y="58" width="265" height="62" rx="10" fill="#163c52"/><text x="442" y="97" fill="#e9f7ff" text-anchor="middle">Slot</text><rect x="592" y="58" width="265" height="62" rx="10" fill="#302d5c"/><text x="724" y="97" fill="#e3dcff" text-anchor="middle">Generation</text></g><text x="890" y="82" fill="#f3f8ff" font-family="Segoe UI,Arial,sans-serif" font-size="19">All three participate</text><text x="890" y="109" fill="#b6c9d9" font-family="Segoe UI,Arial,sans-serif" font-size="17">in validating a live handle.</text></g>
<text x="82" y="709" fill="#8ba8bb" font-family="Segoe UI,Arial,sans-serif" font-size="16">Source-checked lifecycle summary · generation wrap policy and concurrency limits are documented separately</text></svg>