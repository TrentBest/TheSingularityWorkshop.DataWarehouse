<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
<title id="title">DataWarehouse — from lake to slot</title><desc id="desc">A technical visual of the ownership path from DataWarehouse through DataLake and DataShelf to aligned fixed-size slots, with handle and tracking metadata.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071523"/><stop offset="1" stop-color="#142d43"/></linearGradient><linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#37d9ef"/><stop offset="1" stop-color="#3879d9"/></linearGradient><linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#635bce"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter></defs>
<rect width="1440" height="820" rx="32" fill="url(#bg)"/><circle cx="1210" cy="130" r="240" fill="#2385ad" opacity=".08"/><circle cx="220" cy="730" r="250" fill="#7563d8" opacity=".08"/>
<text x="84" y="82" fill="#6ce7f3" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="5">THE SINGULARITY WORKSHOP · DATAWAREHOUSE</text>
<text x="84" y="146" fill="#f3f8ff" font-family="Segoe UI,Arial,sans-serif" font-size="48" font-weight="750">From allocation to address</text>
<text x="84" y="187" fill="#b6c9d9" font-family="Segoe UI,Arial,sans-serif" font-size="22">A narrow, explicit path from ownership to fixed-size unmanaged records.</text>
<g filter="url(#shadow)"><rect x="84" y="250" width="260" height="142" rx="18" fill="#16344a" stroke="#3e8fa8" stroke-width="2"/><rect x="382" y="250" width="260" height="142" rx="18" fill="#16344a" stroke="#3e8fa8" stroke-width="2"/><rect x="680" y="250" width="300" height="142" rx="18" fill="#202d50" stroke="#8d83e9" stroke-width="2"/><rect x="1018" y="250" width="338" height="142" rx="18" fill="#123d50" stroke="#40cde0" stroke-width="2"/></g>
<g fill="#f3f8ff" font-family="Segoe UI,Arial,sans-serif" text-anchor="middle"><text x="214" y="300" font-size="27" font-weight="700">DataWarehouse</text><text x="214" y="334" font-size="17" fill="#b6c9d9">Owns typed shelves</text><text x="512" y="300" font-size="27" font-weight="700">DataLake</text><text x="512" y="334" font-size="17" fill="#b6c9d9">Aligned allocation</text><text x="830" y="300" font-size="27" font-weight="700">DataShelf&lt;T&gt;</text><text x="830" y="334" font-size="17" fill="#c8c4ff">One unmanaged record type</text><text x="1187" y="300" font-size="27" font-weight="700">Slots / bays</text><text x="1187" y="334" font-size="17" fill="#a9edf3">Fixed-size records</text></g>
<g stroke="#7edfeb" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M344 321 H372 l-9 -8 m9 8 -9 8"/><path d="M642 321 H670 l-9 -8 m9 8 -9 8"/><path d="M980 321 H1008 l-9 -8 m9 8 -9 8"/></g>
<text x="84" y="458" fill="#f3f8ff" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">A slot is not an object graph</text><text x="84" y="493" fill="#b6c9d9" font-family="Segoe UI,Arial,sans-serif" font-size="19">Record bytes stay in aligned memory; lifecycle metadata lives beside the payload.</text>
<g transform="translate(84 535)"><rect width="820" height="156" rx="18" fill="#0b1e2d" stroke="#31536a" stroke-width="2"/><text x="28" y="35" fill="#8ceaf3" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2">CONTIGUOUS RECORD REGION</text>
<rect x="28" y="57" width="82" height="62" rx="7" fill="url(#cyan)" opacity="0.82"/><text x="69" y="94" fill="#061724" font-family="Consolas,monospace" font-size="18" font-weight="700" text-anchor="middle">00</text><rect x="122" y="57" width="82" height="62" rx="7" fill="url(#cyan)" opacity="0.82"/><text x="163" y="94" fill="#061724" font-family="Consolas,monospace" font-size="18" font-weight="700" text-anchor="middle">01</text><rect x="216" y="57" width="82" height="62" rx="7" fill="url(#violet)" opacity="1"/><text x="257" y="94" fill="#061724" font-family="Consolas,monospace" font-size="18" font-weight="700" text-anchor="middle">02</text><rect x="310" y="57" width="82" height="62" rx="7" fill="url(#cyan)" opacity="0.82"/><text x="351" y="94" fill="#061724" font-family="Consolas,monospace" font-size="18" font-weight="700" text-anchor="middle">03</text><rect x="404" y="57" width="82" height="62" rx="7" fill="url(#cyan)" opacity="0.82"/><text x="445" y="94" fill="#061724" font-family="Consolas,monospace" font-size="18" font-weight="700" text-anchor="middle">04</text><rect x="498" y="57" width="82" height="62" rx="7" fill="url(#cyan)" opacity="0.82"/><text x="539" y="94" fill="#061724" font-family="Consolas,monospace" font-size="18" font-weight="700" text-anchor="middle">05</text><rect x="592" y="57" width="82" height="62" rx="7" fill="url(#cyan)" opacity="0.82"/><text x="633" y="94" fill="#061724" font-family="Consolas,monospace" font-size="18" font-weight="700" text-anchor="middle">06</text><rect x="686" y="57" width="82" height="62" rx="7" fill="url(#cyan)" opacity="0.82"/><text x="727" y="94" fill="#061724" font-family="Consolas,monospace" font-size="18" font-weight="700" text-anchor="middle">07</text>
<text x="28" y="143" fill="#b6c9d9" font-family="Segoe UI,Arial,sans-serif" font-size="15">slot index × sizeof(T) → record address</text></g>
<g transform="translate(940 535)"><rect width="416" height="156" rx="18" fill="#0b1e2d" stroke="#31536a" stroke-width="2"/><text x="24" y="35" fill="#c4b5fd" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2">SIDE-BAND TRACKING</text><text x="24" y="71" fill="#f3f8ff" font-family="Segoe UI,Arial,sans-serif" font-size="19">Alive bitmap</text><text x="24" y="99" fill="#f3f8ff" font-family="Segoe UI,Arial,sans-serif" font-size="19">Dirty bitmap</text><text x="24" y="127" fill="#f3f8ff" font-family="Segoe UI,Arial,sans-serif" font-size="19">Generation per slot</text></g>
<text x="84" y="764" fill="#8ba8bb" font-family="Segoe UI,Arial,sans-serif" font-size="16">Conceptual, source-checked architecture · not a byte-accurate layout or a performance result</text>
</svg>